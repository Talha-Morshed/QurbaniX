services:
  laravel.test:
    build: ./backend
    image: laravelsail/php82-composer:latest
    container_name: qurbanix-backend
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-8000}:80'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      COMPOSER_ALLOW_SUPERUSER: '1'
    volumes:
      - './backend:/var/www/html'
    command: ['sh', '/var/www/html/docker/entrypoint.sh']
    networks:
      - qurbanix
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  mysql:
    image: 'mysql/mysql-server:8.0'
    container_name: qurbanix-mysql
    ports:
      - '${DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE:-qurbanix}'
      MYSQL_USER: '${DB_USERNAME:-qurbanix}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
    volumes:
      - 'qurbanix-mysql:/var/lib/mysql'
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD
      retries: 3
      timeout: 5s
    networks:
      - qurbanix

  redis:
    image: 'redis:alpine'
    container_name: qurbanix-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s
    networks:
      - qurbanix

  mailpit:
    image: 'axllent/mailpit:latest'
    container_name: qurbanix-mailpit
    ports:
      - '${MAILPIT_PORT:-1025}:1025'
      - '${MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - qurbanix

  frontend:
    image: 'node:20-alpine'
    container_name: qurbanix-frontend
    working_dir: /app
    volumes:
      - './frontend:/app'
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    environment:
      VITE_API_PROXY_TARGET: 'http://laravel.test'
      CHOKIDAR_USEPOLLING: 'true'
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - qurbanix
    depends_on:
      - laravel.test

networks:
  qurbanix:
    driver: bridge

volumes:
  qurbanix-mysql:
    driver: local